# Copy this template to config.yaml and edit it for your experiment.
# config.yaml is local and ignored by Git.

genome: hg38   # genome label for reporting/logging

threads:
  fastp: 8
  star: 16
  samtools: 8
  bigwig: 8

# Reference & index (STAR)
reference:
  star_index: "resources/reference/STAR_index"
  fasta: "resources/reference/genome.fa"
  gtf: "resources/reference/genes.gtf"  # required when metaplot is enabled

# Enable blacklist filtering (requires blacklist.path or blacklist.url)
filter_blacklist: true

# Blacklist (manual)
# Boyle-Lab blacklist repository (examples):
#   https://github.com/Boyle-Lab/Blacklist
#   https://github.com/Boyle-Lab/Blacklist/tree/master/lists
blacklist:
  cache_dir: "resources/blacklist"
  # Provide exactly one of the following:
  # path: "/path/to/custom.blacklist.bed"
  url: "https://raw.githubusercontent.com/Boyle-Lab/Blacklist/master/lists/hg38-blacklist.v2.bed.gz"

# Samples: multiple technical replicates (or lanes) under one sample
# Alternatively use bam: "data/sample.bam" alone to reanalyze existing alignments.
# BAM mode re-filters/sorts/indexes; FASTQ/STAR QC is not regenerated.
samples:
  example_IP_1:
    R1: ["data/example_IP_1_R1.fq.gz"]
    R2: ["data/example_IP_1_R2.fq.gz"]
  example_Input_1:
    R1: ["data/example_Input_1_R1.fq.gz"]
    R2: ["data/example_Input_1_R2.fq.gz"]

# fastp settings
fastp:

  # Step1: QC + Illumina adapter trimming + dedup
  # enable=false disables dedup entirely; dedup=true enables --dedup (used when enable=true)
  dedup_adapter:
    enable: true
    dedup: true  # legacy sequence deduplication; NOT UMI-aware (see README)

  # Step2: GRIP-seq custom trimming
  # enable=false makes step2 a pass-through (no fixed trims, no adapter trimming)
  grip_trim:
    enable: true
    disable_adapter_trimming: true   # -A
    trim_front_r1: 12                # -f
    trim_tail_r1: 10                 # -t
    trim_front_r2: 10                # -F
    trim_tail_r2: 12                 # -T

# STAR alignment settings
star:
  # Keep only uniquely aligned fragments, including RNase-shortened inserts.
  # STAR normally requires >=66% of the total paired-read length to align; that
  # rejects a short informative insert when the other mate is mostly clipped.
  multimap_nmax: 1
  min_match_bases: 20
  min_score_fraction: 0.0
  min_match_fraction: 0.0
  max_mismatch_fraction: 0.10
  max_mismatches: 10
  extra: ""  # optional additional STAR arguments

# Filtering
filtering:
  min_mapq: 11   # MAPQ > 10

# bigwigCompare: log2(IP/Input) tracks per group (deepTools bigwigCompare)
# Per-sample BigWigs within each group side are averaged (pooled) first,
# then log2(IP/Input) is computed. Output: results/bigwig/compare/<group>.<track>.<operation>.bw
bigwigCompare:
  enable: true
  operation: log2          # --operation: log2 / ratio / subtract ...
  pseudocount: 1           # --pseudocount (added before log2 to avoid log(0))
  binSize: 1               # --binSize; NOTE: 1bp is slow (~1.5h per track on hg38), 10/25 is much faster
  # Per-sample tracks to compare (must match names in results/bigwig/<sample>/)
  tracks:
    - R2firstbaseCPM.noblacklist
    - bamCPM.noblacklist
    - crosslinkCPM.noblacklist

  # groups: comparison name -> IP / Input sample lists (all must exist in config.samples)
  groups:
    example_log2_IP_over_Input:
      IP: [example_IP_1]
      Input: [example_Input_1]

# Precise endpoints: R2 is opposite the RNA strand in this library protocol.
# "aligned" is a sensitivity mode retaining uncertain clipped 5-prime ends.
signal:
  five_prime_clip: exclude
  crosslink_shift: 1      # RNA bases upstream; skip CIGAR introns
  require_proper_pair: false
  exclude_duplicates: false  # no second coordinate dedup after fastp
  exclude_qcfail: true

# Optional motif-conditioned diagnostic; never a discovery input or m6A call.
motif_anchoring:
  enable: false
  motif: DRACH
  motif_pos: 3
  search_window: 0
  keep_unmatched: false

# Sequence-unbiased RT local maxima. This is not CLIPper cluster calling.
# MEME discovery and held-out offset analysis use disjoint, deterministic loci.
de_novo_motif:
  enable: true
  samples: all
  variant: auto  # blacklist when enabled; otherwise noblacklist
  min_reads: 40          # strictly greater than 40
  neighbor_fold: 1.5
  sequence_flank: 10
  sequence_center: r2_start
  min_sequences: 10
  max_sequences: 2000
  holdout_fraction: 0.2
  holdout_block_size: 10000
  holdout_guard: 100
  seed: 17
  threads: 4
  nmotifs: 5
  min_width: 4
  max_width: 8

# Relative positions are signed along RNA 5-prime -> 3-prime.
# Background uses nearby shifted genomic windows, not expression/GC matching.
motif_distribution:
  enable: true
  samples: all
  window: 50
  motifs:
    - name: DRACH
      sequence: DRACH
      anchor_pos: 3
  scan_de_novo: true
  consensus_probability_mass: 0.8
  background_min_distance: 200
  background_max_distance: 1000
  background_attempts: 20

# Spliced 5UTR/CDS/3UTR: independently rescale each region, then display widths
# proportional to median region length/CDS length (the published metaPlotR style).
metaplot:
  enable: true
  samples: all
  tracks:
    - bamCPM.noblacklist
    - R2firstbaseCPM.noblacklist
    - crosslinkCPM.noblacklist
  bins: {utr5: 100, cds: 100, utr3: 100}
  axis_scale: median_length
  axis_widths: [1, 1, 1]   # used only with axis_scale: fixed
  min_region_length: 1
  plot_format: pdf

quality:
  min_usable_r2: 100000
  max_five_prime_clip_fraction: 0.2

# Output naming
output:
  dir: "results"

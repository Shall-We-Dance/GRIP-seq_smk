name: Workflow checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install workflow runner
        run: python -m pip install 'snakemake==9.3.3' 'PyYAML==6.0.2' 'pysam==0.24.0' 'pyBigWig==0.3.25' 'numpy>=2,<3' 'scipy>=1.15,<2' 'matplotlib>=3.9,<4' 'cutadapt==5.2' 'deepTools==3.5.6'
      - name: Test signal coordinates, motif statistics, metaplot normalization and DAGs
        run: python -m unittest discover -s tests -v
